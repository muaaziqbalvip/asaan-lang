[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asaan-lang"
version = "1.2.0"
description = "Pakistan ki apni asaan programming language (Urdu / Roman-Urdu). Developer: Muaaz Iqbal."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Muaaz Iqbal"}]
keywords = ["urdu", "education", "programming-language", "pakistan", "roman-urdu"]

[project.scripts]
asaan = "asaan:main"

[tool.setuptools]
py-modules = ["asaan", "studio"]
